version: '3.8'

services:
  security-gateway:
    image: ghcr.io/raaad1on/nginx-gag:${TAG:-latest}
    container_name: nginx-gag
    entrypoint: ["/entrypoint.sh"]
    environment:
      - DOMAIN=${DOMAIN:-example.com}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
      - ./geo-base:/var/www/files
    ports:
      - "127.0.0.1:444:444"
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nginx-gag-network

networks:
  nginx-gag-network:
    driver: bridge
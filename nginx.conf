server {
    listen 0.0.0.0:444 ssl;
    listen unix:/dev/shm/nginx/nginx.sock ssl;
    server_name {{DOMAIN}};

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /auth {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /testspeed {
        limit_req zone=speedtest burst=2 nodelay;
        limit_req_status 429;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment; filename=speedtest-10mb.bin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        rewrite ^ /speedtest-10mb.bin break;
        root /var/www;
    }

    location ~ ^/(api|v1|status) {
        return 403 '{"error": "access_denied", "message": "Authentication required"}';
        add_header Content-Type application/json always;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /";
    }

    access_log off;
    error_log /dev/null;
}

server {
    listen 0.0.0.0:9000;
    location /health {
        return 204;
    }
}
